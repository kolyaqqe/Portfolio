<script>

window.scrollTo(0,0);

// ── Preloader ──

const preloader=document.getElementById('preloader');
const preloaderBar=document.getElementById('preloaderBar');
let loadProgress=0;
let barRaf;

function tickPreloader(){
if(loadProgress<90){
loadProgress+=.6;
preloaderBar.style.width=loadProgress+'%';
barRaf=requestAnimationFrame(tickPreloader);
}
}
tickPreloader();

function finishPreloader(){
cancelAnimationFrame(barRaf);
loadProgress=100;
preloaderBar.style.width='100%';
}

// ── Custom Cursor ──

const cursor=document.getElementById('cursor');
const cursorDot=document.getElementById('cursorDot');
let mouseX=0,mouseY=0;
let cursorX=0,cursorY=0;

document.addEventListener('mousemove',e=>{
mouseX=e.clientX;
mouseY=e.clientY;
cursorDot.style.left=mouseX+'px';
cursorDot.style.top=mouseY+'px';
});

function animateCursor(){
cursorX+=(mouseX-cursorX)*.12;
cursorY+=(mouseY-cursorY)*.12;
cursor.style.left=cursorX+'px';
cursor.style.top=cursorY+'px';
requestAnimationFrame(animateCursor);
}
animateCursor();

document.querySelectorAll('.video-card,.nav-icon,.bottom-nav,a,.hero-btn').forEach(el=>{
el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
});

// ── Mouse Parallax (orbs) ──

const heroEl=document.getElementById('hero');
const orb1=document.getElementById('orb1');
const orb2=document.getElementById('orb2');
const orb3=document.getElementById('orb3');

heroEl.addEventListener('mousemove',e=>{
const cx=e.clientX/window.innerWidth-.5;
const cy=e.clientY/window.innerHeight-.5;
orb1.style.transform=`translate(${cx*-30}px,${cy*-20}px)`;
orb2.style.transform=`translate(${cx*25}px,${cy*15}px)`;
orb3.style.transform=`translate(${cx*-20}px,${cy*25}px)`;
});

// ── Particles (prerendered blur sprites) ──

const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let W,H;
const particles=[];
const PARTICLE_COUNT=50;
let scrollOffset=0;

function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const blurSprites=[];
const BLUR_LEVELS=[3,6,10];

BLUR_LEVELS.forEach(blur=>{
const size=64;
const c=document.createElement('canvas');
c.width=size;
c.height=size;
const cx=c.getContext('2d');
const r=size/2;
const grad=cx.createRadialGradient(r,r,0,r,r,r);
grad.addColorStop(0,'rgba(255,255,255,1)');
grad.addColorStop(0.3,'rgba(255,255,255,0.6)');
grad.addColorStop(1,'rgba(255,255,255,0)');
cx.fillStyle=grad;
cx.beginPath();
cx.arc(r,r,r,0,Math.PI*2);
cx.fill();
blurSprites.push({canvas:c,blur:blur});
});

function getSprite(blur){
let best=blurSprites[0];
let minDiff=Math.abs(blur-best.blur);
for(let i=1;i<blurSprites.length;i++){
const diff=Math.abs(blur-blurSprites[i].blur);
if(diff<minDiff){
minDiff=diff;
best=blurSprites[i];
}
}
return best;
}

class Particle{
constructor(){this.reset()}

reset(){
this.x=Math.random()*W;
this.y=Math.random()*H;
this.size=Math.random()*30+10;
this.speedX=(Math.random()-.5)*.2;
this.speedY=(Math.random()-.5)*.2;
this.baseOpacity=Math.random()*.35+.05;
this.blur=Math.random()*8+2;
this.pulse=Math.random()*Math.PI*2;
this.pulseSpeed=Math.random()*.006+.002;
this.sprite=getSprite(this.blur);
}

update(){
this.x+=this.speedX;
this.y+=this.speedY;
this.pulse+=this.pulseSpeed;
if(this.x<-60)this.x=W+60;
if(this.x>W+60)this.x=-60;
if(this.y<-60)this.y=H+60;
if(this.y>H+60)this.y=-60;
}

draw(){
const o=this.baseOpacity*(0.5+0.5*Math.sin(this.pulse));
const y=this.y-scrollOffset*0.15;
ctx.globalAlpha=o;
ctx.drawImage(this.sprite.canvas,this.x-this.size/2,y-this.size/2,this.size,this.size);
}
}

for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());

function animateParticles(){
ctx.clearRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
for(const p of particles){p.update();p.draw()}
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
requestAnimationFrame(animateParticles);
}
animateParticles();

// ── Hero Reveal ──

const heroTitle=document.getElementById('heroTitle');
const heroSub=document.getElementById('heroSub');
const heroBadge=document.getElementById('heroBadge');
const heroActions=document.getElementById('heroActions');
const heroStats=document.getElementById('heroStats');
const heroScroll=document.getElementById('heroScroll');
const heroGrid=document.getElementById('heroGrid');
const bottomNav=document.getElementById('bottomNav');

window.addEventListener('load',()=>{
setTimeout(()=>{
finishPreloader();
setTimeout(()=>{
document.body.classList.add('loaded');

const revealElements=[
{el:heroGrid,t:0,d:0},
{el:heroBadge,t:1.2,d:.2},
{el:heroTitle,t:1.6,d:.4},
{el:heroSub,t:1.4,d:.8},
{el:heroActions,t:1.4,d:1},
{el:heroStats,t:1.4,d:1.2},
{el:heroScroll,t:2,d:1.6},
{el:bottomNav,t:1.5,d:.6}
];

revealElements.forEach(({el,t,d})=>{
el.style.transition=`opacity ${t}s cubic-bezier(.16,1,.3,1) ${d}s, transform ${t}s cubic-bezier(.16,1,.3,1) ${d}s, filter ${t}s cubic-bezier(.16,1,.3,1) ${d}s`;
el.classList.add('visible');
});

[orb1,orb2,orb3].forEach(o=>{
o.style.transition='opacity 2s ease';
o.classList.add('visible');
});

heroTitle.querySelectorAll('.line span').forEach((span,i)=>{
span.style.transition=`transform 1.4s cubic-bezier(.16,1,.3,1) ${0.4+i*.15}s`;
span.style.transform='translateY(0)';
});

setTimeout(()=>{
const heroEls=[heroGrid,heroBadge,heroTitle,heroSub,heroActions,heroStats,heroScroll,bottomNav,orb1,orb2,orb3];
heroEls.forEach(el=>{el.style.transition='none'});
heroTitle.querySelectorAll('.line span').forEach(s=>{s.style.transition='none'});
},3000);

},400);
},600);
});

// ── Projects (lazy video) ──

const projectsList=document.getElementById('projectsList');
const VIDEO_COUNT=15;
const allVideos=[];

for(let i=1;i<=VIDEO_COUNT;i++){
const card=document.createElement('div');
card.className='video-card';

const video=document.createElement('video');
video.src='./Videos/'+i+'.mp4';
video.muted=true;
video.loop=true;
video.playsInline=true;
video.preload='none';

card.appendChild(video);
projectsList.appendChild(card);
allVideos.push(video);

card.addEventListener('mouseenter',()=>{video.muted=false;video.volume=0.5});
card.addEventListener('mouseleave',()=>{video.muted=true});
}

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const v=entry.target;
if(entry.isIntersecting)v.play().catch(()=>{});
else v.pause();
});
},{threshold:0.2});

allVideos.forEach(v=>observer.observe(v));

// ── Scroll ──

const cards=document.querySelectorAll('.video-card');
let ticking=false;

function onScroll(){
if(ticking)return;
ticking=true;
requestAnimationFrame(()=>{
scrollOffset=window.scrollY;
const scroll=scrollOffset;
const fadeDistance=window.innerHeight*0.8;
const progress=Math.min(scroll/fadeDistance,1);
const ease=1-Math.pow(1-progress,3);

heroTitle.style.transform=`translateY(-${ease*180}px) scale(${1-ease*0.08})`;
heroTitle.style.opacity=1-ease;
heroTitle.style.filter=`blur(${ease*30}px)`;

heroSub.style.opacity=1-ease;
heroSub.style.transform=`translateY(${ease*20}px)`;

heroBadge.style.opacity=.7*(1-ease);
heroBadge.style.transform=`translateY(${ease*10}px)`;

heroActions.style.opacity=1-ease;
heroActions.style.transform=`translateY(${ease*15}px)`;

heroStats.style.opacity=1-ease;
heroStats.style.transform=`translateY(${ease*15}px)`;

heroScroll.style.opacity=0.3*(1-ease);
heroGrid.style.opacity=1-ease;
orb1.style.opacity=(1-ease)*.8;
orb2.style.opacity=(1-ease)*.6;
orb3.style.opacity=(1-ease)*.5;

cards.forEach(card=>{
const rect=card.getBoundingClientRect();
if(rect.top<window.innerHeight*0.75&&rect.bottom>0){
card.classList.add('visible');
}else{
card.classList.remove('visible');
}
});

ticking=false;
});
}

window.addEventListener('scroll',onScroll,{passive:true});

const projects=document.getElementById('projectsList');
projects.addEventListener('wheel',e=>{
if(e.deltaY!==0){e.preventDefault();projects.scrollLeft+=e.deltaY}
},{passive:false});

// ── Progress Bar ──

const progressFill=document.getElementById('progressFill');

projects.addEventListener('scroll',()=>{
const maxScroll=projects.scrollWidth-projects.clientWidth;
if(maxScroll<=0)return;
progressFill.style.width=(projects.scrollLeft/maxScroll)*100+'%';
});

</script>

</body>
</html>
